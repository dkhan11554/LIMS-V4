[project]
name = "nextgen-lims-api"
version = "0.1.0"
description = "FastAPI backend for NextGen AI-LIMS"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "asyncpg>=0.30",
  "email-validator>=2.2",
  "fastapi>=0.116",
  "httpx>=0.28",
  "pydantic-settings>=2.10",
  "psycopg[binary]>=3.2",
  "PyJWT[crypto]>=2.10",
  "SQLAlchemy>=2.0",
  "uvicorn[standard]>=0.35",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
