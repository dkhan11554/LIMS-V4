services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lims
      POSTGRES_PASSWORD: lims
      POSTGRES_DB: lims
    ports:
      - "5432:5432"
    volumes:
      - lims_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://lims:lims@db:5432/lims
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-value}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - lims_document_storage:/app/storage

  # The React app still depends on the legacy Convex SDK / Hercules platform
  # plugins (see /MIGRATION.md, "Frontend integration"). Once its data layer
  # has been repointed at the FastAPI backend below (REST + the /ws
  # WebSocket) and those platform-specific packages removed, uncomment this
  # service to run it as part of the same stack:
  #
  # frontend:
  #   build:
  #     context: ./frontend
  #   restart: unless-stopped
  #   environment:
  #     VITE_API_BASE_URL: http://localhost:8000/api/v1
  #     VITE_WS_BASE_URL: ws://localhost:8000/ws
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend

volumes:
  lims_pg_data:
  lims_document_storage:
